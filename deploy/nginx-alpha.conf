server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name m-notes-alpha.missazertia.com;

    ssl_certificate /root/.acme.sh/missazertia.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/missazertia.com_ecc/missazertia.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    access_log /var/log/nginx/mistakebook-alpha.access.log;
    error_log /var/log/nginx/mistakebook-alpha.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }
}
